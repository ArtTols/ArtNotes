name: ArtNotes

options:
  bundleIdPrefix: com.ArtApps
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "2" # iPad only
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ArtNotes:
    type: application
    platform: iOS
    sources:
      - path: ArtNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ArtApps.ArtNotes
        PRODUCT_NAME: ArtNotes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: ArtNotes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Notebooks live in Documents/Notebooks and are visible in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Lets "Open in ArtNotes" work from Files / Share sheets for PDFs.
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf

  ArtNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ArtNotesTests
    dependencies:
      - target: ArtNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ArtApps.ArtNotesTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ArtNotes:
    build:
      targets:
        ArtNotes: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArtNotesTests
    archive:
      config: Release
